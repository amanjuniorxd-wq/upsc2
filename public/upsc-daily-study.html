const STEP_SECTION = { learn: 'teach', source: 'teach', pyq: 'pyq', prelims: 'prelims', mains: 'mains', revision: 'revision', csat: 'csat' };
function missionPlan() { return E.mission(S.state, S.data, today(), caCounts()); }
function gotoStep(key) {
  const m = missionPlan();
  const topicId = S.ui.missionTopic || m.topicId;
  S.ui.missionTopic = topicId;
  if (key === 'learn') { S.ui.topic = topicId; S.ui.teachStep = 0; renderTeach(); }
  if (key === 'source') { S.ui.topic = topicId; S.ui.teachStep = 2; renderTeach(); }
  if (key === 'pyq') { openPyqForTopic(topicId, false); }
  if (key === 'prelims') { startPrelims('topic', topicId, false); }
  if (key === 'mains') { pickMains(topicId); renderMains(); }
  if (key === 'csat') { startCsat('', false); }
  renderMissionBar();
  go(STEP_SECTION[key]);
}
function renderMissionBar() {
  const bar = $('#missionBar');
  if (!S.ui.mission || !S.state.profile) { bar.classList.remove('on'); return; }
  const m = missionPlan();
  const cur = m.next;
  const idx = cur ? m.steps.findIndex((s) => s.key === cur.key) + 1 : m.steps.length;
  $('#missionBarIn').innerHTML = cur
    ? `<div><div class="kicker">${t('Step {0} of {1}', idx, m.steps.length)}</div><b>${esc(t(STEP_LABEL[cur.key]))}</b> <span class="muted small">· ${fmtMin(cur.minutes)}</span></div>

// ------------------------------------------------------------------ Phase 5: Prelims Practice
function startPrelims(mode, topicId, scroll = true, viaCa = false) {
  let pool = S.data.mcq;
  if (mode === 'topic') pool = pool.filter((q) => q.t === topicId);
  if (mode === 'weak') {
    const st = E.prelimsStats(S.state, S.data);
    const weakTopics = Object.entries(st.byTopic).filter(([, g]) => g.attempts >= 1 && g.accuracy < 0.6).map(([id]) => id);
    pool = pool.filter((q) => weakTopics.includes(q.t));
    if (!pool.length) pool = S.data.mcq;
  }
  if (mode === 'topic' && !pool.length) {                     // topic without MCQs: practise its subject
    const subj = topicById(topicId)?.s;
    pool = S.data.mcq.filter((q) => topicById(q.t)?.s === subj);
  }
  const seenOk = new Set(S.state.attempts.filter((a) => a.c).map((a) => a.qid.replace(/^ca:/, '')));
  const fresh = pool.filter((q) => !seenOk.has(q.id));
  const ids = E.seededPick(fresh.length >= 5 ? fresh : pool, 10, `${E.iso(today())}-${mode}-${topicId}-${S.state.attempts.length}`).map((q) => q.id);
  S.ui.prelims = { mode, topicId, ids, ans: {}, viaCa };
  renderPrelims();
  if (scroll) go('prelims');
}

function answer(ctx, id, i) {
  const now = today();
  if (ctx === 'csat') {
    const q = S.data.csat.find((x) => x.id === id);
    if (!S.ui.csat || S.ui.csat.ans[id] !== undefined) return;
    S.ui.csat.ans[id] = i;
    E.recordAttempt(S.state, { qid: q.id, topic: q.c, subject: 'csat', kind: 'csat', correct: i === q.a }, now);
    E.logMinutes(S.state, now, 2, 'csat');
    save(); renderCsat(); renderReadiness();
    return;
  }
  const q = S.data.mcq.find((x) => x.id === id);
  const topic = topicById(q.t);
  if (ctx === 'teach') { if (S.ui.teachAns !== undefined && S.ui.teachAns !== null) return; S.ui.teachAns = i; }
  else { if (!S.ui.prelims || S.ui.prelims.ans[id] !== undefined) return; S.ui.prelims.ans[id] = i; }
  E.recordAttempt(S.state, { qid: (ctx === 'prelims' && S.ui.prelims.viaCa ? 'ca:' : '') + q.id, topic: q.t, subject: topic.s, kind: 'prelims', correct: i === q.a }, now);
  E.logMinutes(S.state, now, 1.5, 'prelims');
  if (ctx === 'prelims') {
    const P = S.ui.prelims;
    if (Object.keys(P.ans).length === P.ids.length) {               // set complete: feed results into adaptive revision
      const byTopic = {};
      for (const qid of P.ids) { const x = S.data.mcq.find((m) => m.id === qid); (byTopic[x.t] ||= []).push(P.ans[qid] === x.a ? 1 : 0); }
      for (const [tid, v] of Object.entries(byTopic)) E.reviewTopic(S.state, tid, v.reduce((a, b) => a + b, 0) / v.length, now);
      const score = P.ids.filter((qid) => P.ans[qid] === S.data.mcq.find((m) => m.id === qid).a).length;
      toast(t('Set complete: {0}/{1}. Revision updated.', score, P.ids.length));
      renderRevision(); renderSyllabus();
    }
    save(); renderPrelims();
  } else { save(); renderTeach(); }
  renderCommandLite(); renderReadiness();
}
function renderCommandLite() { if (S.state.profile && !S.ui.editProfile) renderCommand(); }

// ------------------------------------------------------------------ Phase 8: Mains Answer Lab
function pickMains(topicId, skip) {
  const done = new Set(S.state.mains.map((m) => m.qid));
  let pool = S.data.mains.filter((q) => !topicId || q.t === topicId);
  if (!pool.length) pool = S.data.mains.filter((q) => topicById(q.t)?.s === topicById(topicId)?.s);
  if (!pool.length) pool = S.data.mains;
  const fresh = pool.filter((q) => !done.has(q.id) && q.id !== skip);
  const q = (fresh.length ? fresh : pool.filter((x) => x.id !== skip).length ? pool.filter((x) => x.id !== skip) : pool)[0];
  S.ui.mains = { qid: q.id, text: '', start: Date.now(), result: null, prev: null, stage: 2 };
}

  if (!S.ui.mains) pickMains(S.ui.topic);
  const M = S.ui.mains;

  const avg = hist.length ? hist.reduce((a, m) => a + m.score / m.max, 0) / hist.length : null;
  const stages = ['QUESTION', 'WORD LIMIT', 'WRITE', 'SUBMIT', 'EVALUATE', 'SEE WEAKNESSES', 'REWRITE'];
  const r = M.result;
  const W = { demand: (w) => t('Missed the demand of the question ({0}): add both sides and a reasoned judgement.', w.demand), dimensions: () => t('Insufficient dimensions: cover more aspects.'), intro: () => t('Weak introduction: open with 2–3 lines that define the issue.'),

  $('#mains').innerHTML = `<div class="card"><div class="row spread"><div class="kicker">${t('MAINS ANSWER LAB')}</div><div class="small muted">${t('Answers written')}: ${nf(hist.length)}${avg != null ? ` · ${t('Average')} ${Math.round(avg * 100)}%` : ''}</div></div>
    <div class="flow">${stages.map((s, i) => `<span class="${i < M.stage ? 'done' : i === M.stage ? 'on' : ''}">${t(s)}</span>`).join('')}</div>
    <p style="font-size:1.05rem"><b>${esc(qText(q))}</b></p>${qAlt(q) ? `<p class="muted" lang="hi">${esc(qAlt(q))}</p>` : ''}
    <div class="row small muted" style="margin-bottom:8px"><span class="chip p">${q.m} ${t('marks')}</span><span class="chip p">${t('WORD LIMIT')}: ${q.wl}</span><span>${esc(tn(topicById(q.t)))}</span>
      <button class="btn ghost sm" data-act="mains-next">${t('Another question')}</button></div>
    ${r ? `<div class="grid g2" style="align-items:start"><div><div class="stat"><b>${r.score}/${r.max}</b><span>${t('Score')} · ${r.words} ${t('words')}</span></div>
        ${M.prev ? `<p class="small muted">${t('Previous attempt')}: ${M.prev.score}/${M.prev.max}</p>` : ''}
        <div class="weak"><div class="kicker" style="color:#fca5a5">${t('MAIN WEAKNESS')}</div><div class="big">${esc(r.main ? W[r.main.key](r.main) : t('No major weakness found. Polish language and add one more example.'))}</div></div>
        <ul class="small">${r.weaknesses.slice(1).map((w) => `<li>${esc(W[w.key](w))}</li>`).join('')}</ul>
        <button class="btn" data-act="mains-rewrite">${t('REWRITE ANSWER')}</button></div>
      <div class="small">${r.covered.length ? `<p><b>${t('Dimensions covered')}:</b> ${esc(r.covered.join(', '))}</p>` : ''}${r.missed.length ? `<p><b>${t('Dimensions to add')}:</b> ${esc(r.missed.join(', '))}</p>` : ''}
        <details><summary class="muted">${t('Your answer')}</summary><p style="white-space:pre-wrap">${esc(M.text)}</p></details></div></div>`
    : `<textarea id="mainsText" aria-label="${t('Your answer')}" lang="${lang()}" placeholder="${lang() === 'hi' ? 'भूमिका…\n\nमुख्य भाग…\n\nनिष्कर्ष / आगे की राह…' : 'Introduction…\n\nBody — points or sub-headings…\n\nConclusion / way forward…'}">${esc(M.text)}</textarea>
      <div class="row spread" style="margin-top:8px"><span class="small muted"><span id="wc">${M.text.trim() ? M.text.trim().split(/\s+/).length : 0}</span> / ${q.wl} ${t('words')}</span><button class="btn" data-act="mains-submit">${t('Submit & evaluate')}</button></div>`}
  </div>`;
}
// Mains strings that the engine keys need
Object.assign(HI, { 'Your answer': 'आपका उत्तर' });

// ------------------------------------------------------------------ Phase 9: adaptive revision
function renderRevision() {
  const b = E.revisionBuckets(S.state, today());
  const item = (x, done) => { const tp = topicById(x.id); if (!tp) return ''; return `<div class="row spread" style="border-top:1px solid var(--line);padding:8px 0">
    <span><b>${esc(tn(tp))}</b> <span class="muted small">${esc(sn(subjectById(tp.s)))}</span> ${x.weak ? `<span class="chip bad">${t('weak')}</span>` : ''}${x.overdue ? ` <span class="chip warn">${t('overdue {0}d', x.overdue)}</span>` : ''}${done ? ` <span class="chip ok">${t('Next in {0} day(s)', x.interval)}</span>` : ''}</span>
    ${done ? '' : `<span class="row">${[['Forgot', 0.2], ['Hard', 0.6], ['Good', 0.8], ['Easy', 1]].map(([l, v]) => `<button class="btn sm ${v < 0.5 ? 'ghost' : 'soft'}" data-act="review" data-id="${x.id}" data-q="${v}">${t(l)}</button>`).join('')}<button class="btn ghost sm" data-act="practise" data-id="${x.id}">${t('PRACTISE')}</button></span>`}</div>`; };
  const group = (title, list, done) => `<div style="margin-top:12px"><div class="kicker">${t(title)} · ${list.length}</div>${list.length ? list.map((x) => item(x, done)).join('') : `<p class="small muted">${t('Nothing here.')}</p>`}</div>`;
  const any = Object.keys(S.state.revision).length;
  $('#revision').innerHTML = `<div class="card"><div class="row spread"><h2 style="margin:0">${t('REVISION DUE TODAY')}: <span style="color:var(--p2)">${nf(b.due)}</span></h2><span class="small muted">Day 0 → ${E.LADDER.map((x) => `+${x}`).join(' → ')}</span></div>
    <p class="small muted">${t('Recall the topic without notes, then rate yourself. Weak recall comes back sooner; strong recall stretches the interval.')}</p>
    ${any ? group('HIGH PRIORITY', b.high) + group('NORMAL', b.normal) + group('COMPLETED', b.done, true) : `<p class="empty">${t('Study a topic or add one to revision to start your schedule.')}</p>`}</div>`;
}

// ------------------------------------------------------------------ Phase 6: current affairs (Khoj 8-area search with fallback)
let caTimer = null; let caLoaded = false;
async function loadCa() {
  caLoaded = true;
  const list = $('#caList'); if (list) list.innerHTML = `<p class="empty">${t('Loading…')}</p>`;
  try {
    const r = await fetch(`/api/ca?${new URLSearchParams({ area: S.ui.caArea, q: S.ui.caQ })}`);
    if (!r.ok) throw new Error(r.status);
    S.ui.ca = await r.json();
    if (!S.ui.caArea && !S.ui.caQ) { S.state.caCounts = { d: E.iso(today()), c: E.caCountsFrom(S.ui.ca.items, S.data) }; save(); }
  } catch { S.ui.ca = { source: 'none', items: [], offline: true }; }
  renderCa();
  if (S.state.profile && !S.ui.rec) renderCommandLite();
}
function renderCa() {
  const C = S.ui.ca;
  const areas = ['', 'polity', 'economy', 'environment', 'science', 'ir', 'society', 'culture', 'security'];
  const srcNote = !C ? '' : C.source === 'khoj' ? t('via Khoj') : C.source === 'pib' ? t('Fallback: PIB official feed') : C.source === 'cache' ? t('Showing saved results from {0}', (C.cachedAt || '').slice(0, 10)) : t('Current affairs are unavailable right now. Saved items appear below.');
  const card = (x, i) => {
    const m = E.mapToTopic(`${x.title} ${x.summary || ''}`, S.data);
    const tp = m && topicById(m.topicId);
    return `<div class="ca"><h3>${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener" data-act="ca-open" data-i="${i}">${esc(x.title)}</a>` : esc(x.title)}</h3>
      <p class="small" style="margin:0 0 4px">${esc(x.summary || '')}</p>
      <div class="row tiny muted"><span>${t('Source')}: ${esc(x.source || '')}${x.published ? ` · ${esc(x.published)}` : ''}</span>
      ${m ? `<span>${t('UPSC relevance')}:</span>${m.papers.map((p) => `<span class="chip p">${esc(p)}</span>`).join('')}` : `<span class="chip">${t('No syllabus link found')}</span>`}</div>
      ${tp ? `<div class="row" style="margin-top:6px"><button class="btn ghost sm" data-act="teach" data-id="${tp.id}">${t('RELATED TOPIC')}: ${esc(tn(tp))}</button><button class="btn ghost sm" data-act="ca-practise" data-id="${tp.id}" data-i="${i}">${t('PRACTISE')}</button><button class="btn soft sm" data-act="ca-save" data-id="${tp.id}" data-i="${i}">${t('ADD TO REVISION')}</button></div>` : ''}</div>`;
  };
  const saved = S.state.ca.saved.slice(-8).reverse();
  $('#ca').innerHTML = `<div class="card"><div class="row spread"><div class="kicker">${t('Current Affairs')}</div><span class="tiny muted">${esc(srcNote)}</span></div>
    <div class="tabs">${areas.map((a) => `<button class="chip ${S.ui.caArea === a ? 'on' : ''}" data-act="ca-area" data-area="${a}">${a ? t(a) : t('All')}</button>`).join('')}</div>
    <input type="search" placeholder="${t('Search current affairs…')}" value="${esc(S.ui.caQ)}" data-act="ca-search" aria-label="${t('Search current affairs…')}" style="width:100%;margin-bottom:8px">
    <div id="caList">${!C ? `<p class="empty">${t('Loading…')}</p>` : C.items.length ? C.items.slice(0, 30).map(card).join('') : `<p class="empty">${esc(srcNote)}</p>`}</div>
    ${saved.length ? `<div style="margin-top:10px"><div class="kicker">${t('Saved for revision')}</div>${saved.map((x) => `<div class="small" style="padding:4px 0">${x.url ? `<a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>` : esc(x.title)} <span class="muted">· ${esc(tn(topicById(x.topic)))}</span></div>`).join('')}</div>` : ''}</div>`;
}

// ------------------------------------------------------------------ Phase 11: readiness
const AREA_GO = { prelims: ['prelims', 'practise-weak'], csat: ['csat', 'csat-cat'], mains: ['mains', 'goto'], answerWriting: ['mains', 'goto'], revision: ['revision', 'goto'], currentAffairs: ['ca', 'goto'] };
function renderReadiness() {
  const R = E.readiness(S.state, S.data, today(), caCounts());
  const keys = ['prelims', 'mains', 'csat', 'revision', 'currentAffairs', 'answerWriting'];
  $('#readiness').innerHTML = `<div class="card"><div class="kicker">${t('UPSC READINESS')}</div>
    ${keys.map((k) => `<div class="rd"><span>${t(k)}</span>${meter(R.area[k] ?? 0)}<span class="small">${R.area[k] == null ? `<span class="muted tiny">${t('Not started')}</span>` : `${R.area[k]}`}</span></div>`).join('')}
    <div class="grid g3" style="margin-top:10px"><div class="stat"><span>${t('STRONGEST AREA')}</span><b style="font-size:1.05rem">${R.strongest ? t(R.strongest) : '—'}</b></div>
      <div class="stat"><span>${t('WEAKEST AREA')}</span><b style="font-size:1.05rem">${R.weakest ? t(R.weakest) : '—'}</b></div>
      <div class="stat"><span>${t('NEXT PRIORITY')}</span><b style="font-size:1.05rem">${R.next ? t(R.next) : '—'}</b>${R.next ? `<button class="btn sm" style="margin-top:4px" data-act="ready-go" data-area="${R.next}">${t('Go')} →</button>` : ''}</div></div>
    <details style="margin-top:8px"><summary class="small muted">${t('How these scores work')}</summary><p class="small muted">${t('Prelims = accuracy (weighted by number of attempts, full weight at 40) and syllabus coverage. CSAT = accuracy, full weight at 16 attempts. Mains = average answer score relative to a strong 75% answer, full weight at 5 answers. Answer Writing = answers in the last 14 days (target 7). Revision = share of scheduled topics not overdue. Current Affairs = items read or saved in the last 7 days (target 10).')}</p></details></div>`;
}

function renderAll() { renderNav(); renderCommand(); renderTeach(); renderSyllabus(); renderPrelims(); renderPyq(); renderMains(); renderRevision(); renderCa(); renderCsat(); renderReadiness(); renderMissionBar(); }

// ------------------------------------------------------------------ actions (one delegated listener)
const ACT = {
  lang() { S.state.lang = lang() === 'hi' ? 'en' : 'hi'; save(); renderAll(); },
  'profile-edit'() { S.ui.editProfile = true; renderCommand(); go('command'); },
  'profile-cancel'() { S.ui.editProfile = false; renderCommand(); },
  recommend() { S.ui.rec = E.recommend(S.state, S.data, today(), caCounts()); if (S.ui.rec) S.ui.topic = S.ui.rec.topicId; renderCommand(); $('#recCard')?.focus?.(); },
  teach(el) { S.ui.topic = el.dataset.id; S.ui.teachStep = 0; S.ui.teachAns = null; renderTeach(); go('teach'); },
  'teach-step'(el) { S.ui.teachStep = +el.dataset.i; S.ui.teachAns = null; renderTeach(); },
  studied(el) { E.markStudied(S.state, el.dataset.id, today()); save(); toast(t('Studied. First revision on {0}.', S.state.revision[el.dataset.id].due)); renderTeach(); renderRevision(); renderSyllabus(); renderCommandLite(); renderReadiness(); },
  'pyq-topic'(el) { openPyqForTopic(el.dataset.id); },
  'pyq-paper'(el) { S.ui.pyq.paper = el.dataset.paper; loadPyq(); },
  'pyq-open'(el) { S.state.pyqOpened[el.dataset.id] = (S.state.pyqOpened[el.dataset.id] || 0) + 1; E.logMinutes(S.state, today(), 5, 'pyq'); save(); return true; },
  practise(el) { startPrelims('topic', el.dataset.id); },
  'practise-weak'(el) { startPrelims(el.dataset.id ? 'topic' : 'weak', el.dataset.id); },
  'prelims-mode'(el) { startPrelims(el.dataset.mode, S.ui.prelims?.topicId || S.ui.topic || S.ui.rec?.topicId, false); },
  answer(el) { answer(el.dataset.ctx, el.dataset.id, +el.dataset.i); },
  'csat-cat'(el) { startCsat(el.dataset.cat || ''); },
  'mains-topic'(el) { pickMains(el.dataset.id); renderMains(); go('mains'); },
  'mains-next'() { pickMains(S.ui.mains?.qid ? S.data.mains.find((q) => q.id === S.ui.mains.qid).t : S.ui.topic, S.ui.mains?.qid); renderMains(); },
  'mains-submit'() {
    const M = S.ui.mains; M.text = $('#mainsText').value;
    if (M.text.trim().split(/\s+/).length < 30) { toast(t('Write at least 30 words.')); return; }
    const q = S.data.mains.find((x) => x.id === M.qid);
    M.result = E.evaluateMains(M.text, q); M.stage = 5;
    const mins = Math.min(60, Math.max(5, Math.round((Date.now() - M.start) / 60000)));
    E.recordMains(S.state, { qid: q.id, topic: q.t, score: M.result.score, max: M.result.max, words: M.result.words, main: M.result.main }, today(), mins);
    save(); renderMains(); renderRevision(); renderReadiness(); renderCommandLite(); renderSyllabus();
  },
  'mains-rewrite'() { const M = S.ui.mains; M.prev = M.result; M.result = null; M.stage = 6; M.start = Date.now(); renderMains(); $('#mainsText')?.focus(); },
  review(el) { const r = E.reviewTopic(S.state, el.dataset.id, +el.dataset.q, today()); E.logMinutes(S.state, today(), 5, 'revision'); save(); toast(t('Next in {0} day(s)', r.interval)); renderRevision(); renderCommandLite(); renderReadiness(); renderSyllabus(); },
  'add-rev'(el) { E.scheduleTopic(S.state, el.dataset.id, today()); save(); toast(t('Added to revision')); renderRevision(); renderCommandLite(); },
  'ca-area'(el) { S.ui.caArea = el.dataset.area; loadCa(); },
  'ca-open'(el) { const x = S.ui.ca.items[+el.dataset.i]; S.state.ca.seen[x.url || x.title] = E.iso(today()); save(); return true; },
  'ca-practise'(el) { const x = S.ui.ca.items[+el.dataset.i]; S.state.ca.seen[x.url || x.title] = E.iso(today()); save(); startPrelims('topic', el.dataset.id, true, true); },
  'ca-save'(el) {
    const x = S.ui.ca.items[+el.dataset.i];
    if (!S.state.ca.saved.some((s) => (s.url || s.title) === (x.url || x.title))) S.state.ca.saved.push({ title: x.title, url: x.url, topic: el.dataset.id, d: E.iso(today()) });
    S.state.ca.saved = S.state.ca.saved.slice(-100);
    E.scheduleTopic(S.state, el.dataset.id, today()); save(); toast(t('Added to revision')); renderCa(); renderRevision(); renderReadiness(); renderCommandLite();
  },
  'ready-go'(el) {
    const a = el.dataset.area;
    if (a === 'prelims') return startPrelims('weak');
    if (a === 'csat') return startCsat('');
    return go(AREA_GO[a][0]);
  },
  'mission-start'() { S.ui.mission = true; const m = missionPlan(); S.ui.missionTopic = m.topicId; if (m.next) gotoStep(m.next.key); renderCommand(); },
  'mission-done'() {
    const m = missionPlan(); if (!m.next) return;
    E.completeStep(S.state, today(), m.next.key, m.next.minutes);
    if (m.next.key === 'learn' || m.next.key === 'source') E.markStudied(S.state, S.ui.missionTopic, today());
    save(); toast(t('Step done'));
    const n = missionPlan().next;
    renderCommand(); renderRevision(); renderSyllabus(); renderReadiness();
    if (n) gotoStep(n.key); else { renderMissionBar(); go('command'); }
  },
  'mission-exit'() { S.ui.mission = false; renderMissionBar(); renderCommand(); },
};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || el.tagName === 'SELECT' || el.tagName === 'INPUT') return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  const keepDefault = fn(el, e) === true;              // links that open official pages keep their default action
  if (!keepDefault) e.preventDefault();
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.act === 'teach-select') { S.ui.topic = el.value; S.ui.teachStep = 0; S.ui.teachAns = null; renderTeach(); }
  if (el.dataset.act === 'pyq-filter-paper') { S.ui.pyq.paper = el.value; loadPyq(); }
  if (el.dataset.act === 'pyq-filter-year') { S.ui.pyq.year = el.value; loadPyq(); }
});
let pyqTimer = null;
document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.id === 'mainsText') { S.ui.mains.text = el.value; const w = $('#wc'); if (w) w.textContent = el.value.trim() ? el.value.trim().split(/\s+/).length : 0; if (S.ui.mains.stage < 3) S.ui.mains.stage = 3; }
  if (el.dataset.act === 'ca-search') { clearTimeout(caTimer); caTimer = setTimeout(() => { S.ui.caQ = el.value.trim(); loadCa().then(() => { const i = document.querySelector('[data-act=ca-search]'); i?.focus(); i?.setSelectionRange(i.value.length, i.value.length); }); }, 450); }
  if (el.dataset.act === 'pyq-search') { clearTimeout(pyqTimer); pyqTimer = setTimeout(() => { S.ui.pyq.q = el.value.trim(); loadPyq().then(() => { const i = document.querySelector('[data-act=pyq-search]'); i?.focus(); i?.setSelectionRange(i.value.length, i.value.length); }); }, 450); }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'profileForm') return;
  e.preventDefault();
  const f = new FormData(e.target);
  const p = { year: +f.get('year'), level: f.get('level'), hours: Math.max(1, Math.min(16, +f.get('hours') || 6)), optional: f.get('optional'), medium: f.get('medium'), focus: f.get('focus') };
  const firstTime = !S.state.profile;
  S.state.profile = { ...(S.state.profile || {}), ...p };
  if (firstTime || p.medium !== 'bi') S.state.lang = p.medium === 'hi' ? 'hi' : 'en';
  S.ui.editProfile = false; S.ui.rec = null;
  save(); toast(t('Profile saved')); renderAll();
});
// keyboard: 1–4 answers the first unanswered question in the section that has focus
document.addEventListener('keydown', (e) => {
  if (!/^[1-4]$/.test(e.key) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) return;
  const sec = document.activeElement?.closest('section'); if (!sec) return;
  const btn = sec.querySelector(`.q .opt:not(:disabled)[data-i="${+e.key - 1}"]`); if (btn) { btn.click(); }
});

// ------------------------------------------------------------------ boot: paint from local state first, then load content once
async function boot() {
  S.state = E.loadState(localStorage);
  renderNav();
  try {
    const r = await fetch('/data/upsc-data.json');
    if (!r.ok) throw new Error(r.status);
    S.data = await r.json();
  } catch {
    $('#commandBody').innerHTML = `<div class="card empty"><p>${t('Could not load study data. Check your connection and reload.')}</p><button class="btn" onclick="location.reload()">${t('Reload')}</button></div>`;
    return;
  }
  renderAll();
  const io = 'IntersectionObserver' in window ? new IntersectionObserver((en) => { if (en.some((x) => x.isIntersecting) && !caLoaded) loadCa(); }, { rootMargin: '400px' }) : null;
  if (io) io.observe($('#ca')); else loadCa();
  (window.requestIdleCallback || ((f) => setTimeout(f, 1200)))(() => { if (!caLoaded) loadCa(); if (!S.ui.pyqRes) loadPyq(); });
  const secObs = 'IntersectionObserver' in window && new IntersectionObserver((en) => {
    for (const x of en) if (x.isIntersecting) document.querySelectorAll('#secnav a').forEach((a) => a.classList.toggle('on', a.getAttribute('href') === `#${x.target.id}`));
  }, { rootMargin: '-45% 0px -50% 0px' });
  if (secObs) document.querySelectorAll('main section').forEach((s) => secObs.observe(s));
}
window.__gyanagi = S;                                     // used by browser tests
boot();
</script>
